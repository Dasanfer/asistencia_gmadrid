<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {
    getFirestore,
    doc,
    getDoc,
    setDoc,
    getDocs,
    collection
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

const firebaseConfig = {
    apiKey: "AIzaSyA5vN0AbfISP-g-TrvX4Y34cZM8lejrYUM",
    authDomain: "fichaje-gmadrid.firebaseapp.com",
    projectId: "fichaje-gmadrid",
    storageBucket: "fichaje-gmadrid.firebasestorage.app",
    messagingSenderId: "794464212993",
    appId: "1:794464212993:web:7cd442168aa97f63d9c800"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let respuestaExistente = false;

window.mostrarMensaje = function(texto, tipo = 'exito') {
    const mensaje = document.getElementById("mensaje");
    const textoMensaje = document.getElementById("textoMensaje");

    if (!texto || texto.trim() === "") {
        ocultarMensaje();
        return;
    }

    textoMensaje.textContent = texto;
    mensaje.style.display = "block";

    if (tipo === 'exito') {
        mensaje.style.background = "#dcfce7";
        mensaje.style.color = "#16a34a";
        document.querySelector('.btn-cerrar-mensaje').style.color = "#16a34a";
    } else if (tipo === 'advertencia') {
        mensaje.style.background = "#eff6ff";
        mensaje.style.color = "#0078d4";
        document.querySelector('.btn-cerrar-mensaje').style.color = "#0078d4";
    } else {
        mensaje.style.background = "#fee2e2";
        mensaje.style.color = "#dc2626";
        document.querySelector('.btn-cerrar-mensaje').style.color = "#dc2626";
    }
}

window.ocultarMensaje = function() {
    const mensaje = document.getElementById("mensaje");
    mensaje.style.display = "none";
    document.getElementById("textoMensaje").textContent = "";
}

window.limpiarMensaje = function(){
    ocultarMensaje();
}

window.mostrarAsistencia = function(){
    const nombre = document.getElementById("nombre").value;
    document.getElementById("bloqueAsistencia").style.display = nombre ? "block" : "none";
    document.getElementById("bloqueHorario").style.display = "none";
}

window.mostrarHorario = function(){
    const asistencia = document.querySelector('input[name="asiste"]:checked');
    if(!asistencia){
        return;
    }
    document.getElementById("bloqueHorario").style.display = asistencia.value === "si" ? "block" : "none";

    if(asistencia.value !== "si"){
        document.querySelectorAll('input[name="hora"]').forEach(radio => {
            radio.checked = false;
        });
    }
}

function obtenerProximoDiaSemana(numeroDia){
    const hoy = new Date();
    const fecha = new Date(hoy);
    let diferencia = numeroDia - hoy.getDay();

    if(diferencia < 0){
        diferencia += 7;
    }

    fecha.setDate(hoy.getDate() + diferencia);

    return fecha.toLocaleDateString("es-ES", {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric"
    });
}

function obtenerFechaEventoGrupo(grupo){
    const hoy = new Date();
    const fecha = new Date(hoy);
    const diaObjetivo = grupo === "Martes" ? 2 : 4;
    let diferencia = diaObjetivo - hoy.getDay();

    if(diferencia < 0){
        diferencia += 7;
    }

    fecha.setDate(hoy.getDate() + diferencia);

    return fecha.toLocaleDateString("es-ES");
}

function obtenerFechaEvento(){
    const grupo = document.getElementById("nombre").selectedOptions[0].parentElement.label;
    return obtenerFechaEventoGrupo(grupo);
}

// Genera un ID único en Firebase incorporando el nombre con paréntesis y el grupo para evitar colisiones
function obtenerIdSocio(nombreSeleccionado, grupo){
    const nombreClean = nombreSeleccionado
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/\s+/g, "_");
    return `${nombreClean}_${grupo}`;
}

window.guardarFirebase = async function(registro){
    try{
        const documento = doc(db, "asistencia", obtenerIdSocio(registro.nombre, registro.grupo));
        await setDoc(documento, registro);
        return true;
    }
    catch(error){
        console.error(error);
        mostrarMensaje("Error al guardar", "error");
        return false;
    }
};

window.buscarRespuestaSocio = async function(nombreSeleccionado, grupo){
    try{
        const documento = doc(db, "asistencia", obtenerIdSocio(nombreSeleccionado, grupo));
        const resultado = await getDoc(documento);

        if(!resultado.exists()){
            respuestaExistente = false;
            document.getElementById("btnEnviar").textContent = "Enviar respuesta";
            return;
        }

        respuestaExistente = true;
        document.getElementById("btnEnviar").textContent = "Modificar respuesta";

        const datos = resultado.data();
        
        if(datos.fechaEvento !== obtenerFechaEventoGrupo(datos.grupo)){
            respuestaExistente = false;
            document.getElementById("btnEnviar").textContent = "Enviar respuesta";
            return;
        }

        document.querySelectorAll('input[name="asiste"]').forEach(radio => {
            radio.checked = radio.value === datos.asistencia;
        });

        mostrarHorario();

        document.querySelectorAll('input[name="hora"]').forEach(radio => {
            radio.checked = radio.value === datos.horaLlegada;
        });

        mostrarMensaje("ℹ️ Respuesta recuperada correctamente", "advertencia");
    }
    catch(error){
        console.error(error);
    }
};

window.cargarSocio = async function(){
    limpiarMensaje();
    respuestaExistente = false;

    document.getElementById("btnEnviar").textContent = "Enviar respuesta";

    document.querySelectorAll('input[name="asiste"]').forEach(radio => {
        radio.checked = false;
    });

    document.querySelectorAll('input[name="hora"]').forEach(radio => {
        radio.checked = false;
    });

    document.getElementById("bloqueHorario").style.display = "none";

    const selectElement = document.getElementById("nombre");
    const valorSeleccionado = selectElement.value;

    if(!valorSeleccionado){
        localStorage.removeItem('gmadrid_socio_actual');
        document.getElementById("bloqueAsistencia").style.display = "none";
        return;
    }

    const grupoSeleccionado = selectElement.selectedOptions[0].parentElement.label;

    localStorage.setItem('gmadrid_socio_actual', valorSeleccionado);
    document.getElementById("bloqueAsistencia").style.display = "block";

    await buscarRespuestaSocio(valorSeleccionado, grupoSeleccionado);
    
    let fechaEvento = "";

    if(grupoSeleccionado === "Martes"){
        fechaEvento = obtenerProximoDiaSemana(2);
    } else if(grupoSeleccionado === "Jueves"){
        fechaEvento = obtenerProximoDiaSemana(4);
    }

    document.getElementById("textoAsistencia").textContent = `¿Vas a asistir el día ${fechaEvento.charAt(0).toUpperCase() + fechaEvento.slice(1)}?`;
}

window.enviarRespuesta = async function(){
    const selectElement = document.getElementById("nombre");
    const grupo = selectElement.selectedOptions[0].parentElement.label;
    const valorSeleccionado = selectElement.value; // Mantiene "Carlos (Martes)" o "Carlos (Jueves)"
    
    const asistencia = document.querySelector('input[name="asiste"]:checked');
    const hora = document.querySelector('input[name="hora"]:checked');

    if(!valorSeleccionado){
        mostrarMensaje("❌ Selecciona tu nombre", "error");
        return;
    }

    if(!asistencia){
        mostrarMensaje("❌ Selecciona una opción de asistencia", "error");
        return;
    }

    if(asistencia.value === "si" && !hora){
        mostrarMensaje("❌ Indica una hora aproximada", "error");
        return;
    }

    const registro = {
        nombre: valorSeleccionado, // Se guarda completo con el paréntesis en Firebase
        grupo,
        asistencia: asistencia.value,
        horaLlegada: hora ? hora.value : "",
        fechaEvento: obtenerFechaEvento(),
        fechaRespuesta: new Date().toLocaleDateString("es-ES"),
        horaRespuesta: new Date().toLocaleTimeString("es-ES")
    };

    const guardado = await guardarFirebase(registro);

    if(guardado){
        cargarAsistentes();
        mostrarMensaje(respuestaExistente ? "✅ Respuesta editada correctamente" : "✅ Respuesta registrada correctamente", "exito");
    }
}

window.cargarAsistentes = async function(){
    const asistentes = [];
    let asistentesMartes = 0;
    let asistentesJueves = 0;
    let dudasMartes = 0;
    let dudasJueves = 0;

    try{
        const tabla = document.getElementById("tablaAsistentes");
        const filtroGrupo = document.getElementById("filtroGrupo").value;
        const mostrarNo = document.getElementById("filtroNo").checked;
        const mostrarDuda = document.getElementById("filtroDuda").checked;

        tabla.innerHTML = "";

        const snapshot = await getDocs(collection(db, "asistencia"));

        snapshot.forEach(doc => {
            const datos = doc.data();
            
            if(datos.fechaEvento === obtenerFechaEventoGrupo(datos.grupo)){
                if(datos.asistencia === "si"){
                    if(datos.grupo === "Martes") asistentesMartes++;
                    if(datos.grupo === "Jueves") asistentesJueves++;
                }
                if(datos.asistencia === "duda"){
                    if(datos.grupo === "Martes") dudasMartes++;
                    if(datos.grupo === "Jueves") dudasJueves++;
                }
            }

            const cumpleAsistencia = datos.asistencia === "si" || (mostrarNo && datos.asistencia === "no") || (mostrarDuda && datos.asistencia === "duda");

            if(cumpleAsistencia && datos.fechaEvento === obtenerFechaEventoGrupo(datos.grupo) && (filtroGrupo === "Todos" || datos.grupo === filtroGrupo)){
                asistentes.push(datos);
            }
        });

        asistentes.sort((a,b)=>{
            const orden = { si: 1, duda: 2, no: 3 };
            if(orden[a.asistencia] !== orden[b.asistencia]){
                return orden[a.asistencia] - orden[b.asistencia];
            }
            return (a.horaLlegada || "").localeCompare(b.horaLlegada || "");
        });

        const plazasLibresMartes = 28 - asistentesMartes - dudasMartes;
        const plazasLibresJueves = 22 - asistentesJueves - dudasJueves;

        const expansionMartes = Math.min(3, plazasLibresMartes);
        const erasmusMartes = Math.max(0, plazasLibresMartes - 3);

        const expansionJueves = Math.min(3, plazasLibresJueves);
        const erasmusJueves = Math.max(0, plazasLibresJueves - 3);
        
        const fechaMartes = obtenerFechaEventoGrupo("Martes");
        const fechaJueves = obtenerFechaEventoGrupo("Jueves");

        let resumen = "";

        if(filtroGrupo === "Todos" || filtroGrupo === "Martes"){
            resumen += `<b>Martes (${fechaMartes}):</b> ${asistentesMartes} asistentes, ${plazasLibresMartes} plazas libres (${expansionMartes} Expansión, ${erasmusMartes} Erasmus).`;
        }

        if(filtroGrupo === "Todos" && resumen !== ""){
            resumen += "<br><br>";
        }

        if(filtroGrupo === "Todos" || filtroGrupo === "Jueves"){
            resumen += `<b>Jueves (${fechaJueves}):</b> ${asistentesJueves} asistentes, ${plazasLibresJueves} plazas libres (${expansionJueves} Expansión, ${erasmusJueves} Erasmus).`;
        }

        document.getElementById("resumenPlazas").innerHTML = resumen;

        if (asistentes.length === 0) {
            tabla.innerHTML = `<tr><td colspan="4" style="text-align: center; color: #888; padding: 20px;">No hay registros para este filtro.</td></tr>`;
            return;
        }

        asistentes.forEach(persona => {
            let estado = "";
            if(persona.asistencia === "si"){
                estado = "🟢 Sí";
            } else if(persona.asistencia === "no"){
                estado = "🔴 No";
            } else {
                estado = "🟠 En duda";
            }
            
            // Aquí quitamos el paréntesis (Martes) / (Jueves) solo para mostrarlo limpio en la tabla
            const nombreLimpio = (persona.nombre || "").replace(/\s*\((Martes|Jueves)\)/gi, "").trim();

            tabla.innerHTML += `
                <tr>
                    <td>${nombreLimpio}</td>
                    <td>${persona.grupo || "-"}</td>
                    <td>${estado}</td>
                    <td>${persona.horaLlegada || "-"}</td>
                </tr>
            `;
        });
    }
    catch(error){
        console.error(error);
    }
};

window.addEventListener('DOMContentLoaded', () => {
    const socioGuardado = localStorage.getItem('gmadrid_socio_actual');
    if (socioGuardado) {
        document.getElementById('nombre').value = socioGuardado;
        cargarSocio();
    }
    cargarAsistentes();
});
</script>
